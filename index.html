<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080C18"><title>Finance Real</title><style>
*{box-sizing:border-box}body{margin:0;background:#080C18;color:#e8edf5;font:14px system-ui,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}#app{max-width:430px;height:100dvh;margin:auto;display:flex;flex-direction:column}.top{padding:15px 16px;border-bottom:1px solid #1a2640;font-weight:800;display:flex;justify-content:space-between}.content{overflow:auto;flex:1;padding:14px 13px 92px}.nav{display:flex;border-top:1px solid #1a2640;background:#080c18;padding:8px 0 max(8px,env(safe-area-inset-bottom))}.nav button{flex:1;background:none;border:0;color:#64748b;font-size:11px}.nav button.active{color:#818cf8}.card{background:#0d1526;border:1px solid #1a2640;border-radius:17px;padding:15px;margin-bottom:12px}.muted{color:#64748b}.small{font-size:11px}.value{font-size:27px;font-weight:800}.green{color:#34d399}.red{color:#f87171}.amber{color:#fbbf24}.purple{color:#818cf8}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stack{display:flex;flex-direction:column;gap:9px}.pillrow{display:flex;gap:6px;overflow:auto;padding:5px 0 12px}.pill{flex-shrink:0;border:1px solid #253351;border-radius:30px;background:#0d1526;color:#94a3b8;padding:6px 11px;font-size:11px}.pill.active{border-color:#6366f1;color:#a5b4fc;background:#1c2051}.tx{display:flex;gap:9px;align-items:center;padding:12px;background:#0d1526;border:1px solid #1a2640;border-radius:13px;margin:7px 0;width:100%;color:inherit;text-align:left}.txmain{flex:1;min-width:0}.txmain strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txmain small{display:block;color:#64748b;margin-top:4px}.btn{border:0;border-radius:11px;background:#6366f1;color:white;font-weight:700;padding:12px 14px}.btn.alt{background:#1c2942;color:#cbd5e1}.btn.danger{background:#b91c1c}.btn:disabled{opacity:.4}.wide{width:100%}.fab{position:fixed;bottom:83px;left:calc(50% + 153px);border-radius:50%;width:51px;height:51px;font-size:27px;box-shadow:0 8px 24px #6366f155}.overlay{position:fixed;inset:0;background:#000c;display:flex;align-items:flex-end;justify-content:center;z-index:20}.modal{width:100%;max-width:430px;max-height:92dvh;overflow:auto;background:#0d1526;border:1px solid #26344d;border-radius:22px 22px 0 0;padding:19px 16px max(28px,env(safe-area-inset-bottom))}.field{display:block;margin:9px 0}.field span{display:block;color:#94a3b8;font-size:11px;font-weight:700;margin-bottom:5px;text-transform:uppercase}.inp{width:100%;padding:11px;border:1px solid #2b3b54;border-radius:10px;background:#111827;color:#e8edf5;outline:none}.inp:focus{border-color:#6366f1}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toggle{display:flex;align-items:center;gap:9px;padding:8px 0}.toggle input{accent-color:#6366f1}.notice{font-size:12px;color:#94a3b8;line-height:1.5}.error{color:#f87171}.divider{border-top:1px solid #1a2640;margin:12px 0}.toast{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#065f46;padding:10px 16px;border-radius:22px;z-index:50;max-width:90%;text-align:center}.chip{font-size:10px;padding:3px 6px;border-radius:7px;background:#1b2942;color:#94a3b8}.bar{height:6px;border-radius:4px;background:#253351;overflow:hidden}.bar>div{height:100%;background:#6366f1}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.account{display:flex;gap:10px;align-items:center;border-bottom:1px solid #1a2640;padding:10px 0}.account:last-child{border:0}@media(max-width:380px){.fab{left:auto;right:14px}}
</style></head><body><div id="app"></div><script>
(function(){'use strict';
const TODAY=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const read=(k,def)=>{try{const x=localStorage.getItem('fr6_'+k);return x?JSON.parse(x):def}catch{return def}};
const write=(k,v)=>{try{localStorage.setItem('fr6_'+k,JSON.stringify(v))}catch(e){console.warn('Armazenamento indisponível:',e)}};
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:(state.cfg&&state.cfg.currency)||'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>d?d.split('-').reverse().join('/'):'—';
const ym=d=>(d||'').slice(0,7);
const iso=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const monthShift=(date,n)=>{const [y,m,d]=date.split('-').map(Number);const base=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth()+1,0)).getUTCDate();return iso(base.getUTCFullYear(),base.getUTCMonth()+1,Math.min(d,last))};
const dayShift=(date,n)=>{const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const next=(date,freq,n)=>freq==='weekly'?dayShift(date,7*n):monthShift(date,freq==='yearly'?12*n:n);
const categories={food:'🍔 Alimentação',transport:'🚗 Transporte',health:'💊 Saúde',leisure:'🎮 Lazer',bills:'📄 Contas',shopping:'🛍️ Compras',salary:'💰 Salário',transfer:'🔄 Transferência',other:'📦 Outros'};
const defaultAccounts=[{id:'acc1',name:'Nubank',type:'checking',color:'#820AD1',icon:'💳',balance:3200,includeInTotal:true},{id:'acc2',name:'Itaú CC',type:'checking',color:'#FF6B00',icon:'🏦',balance:1850.5,includeInTotal:true},{id:'acc3',name:'Poupança',type:'savings',color:'#10B981',icon:'🐷',balance:8400,includeInTotal:true},{id:'acc4',name:'Visa Ouro',type:'credit',color:'#F59E0B',icon:'💎',balance:-1200,includeInTotal:true}];
const state={accs:read('accs',[]),txs:read('txs',[]),balH:read('balH',{}),cfg:read('ucfg',{lang:'pt',currency:'BRL',tipsEnabled:false}),meta:read('meta_v7',null),tab:'home',month:ym(TODAY()),filter:'all',accountFilter:'all',modal:null,selected:null,edit:null,scope:'only',toast:null};
// Migration: the v6 account.balance was a static snapshot; preserve it as opening balance,
// and do not count existing paid records again during migration.
if(!state.meta){state.meta={version:7,migratedAt:TODAY(),opening:{},excludedPaidIds:[],seriesRules:{},seriesStarts:{}};state.accs.forEach(a=>state.meta.opening[a.id]=Number(a.balance)||0);state.meta.excludedPaidIds=Array.isArray(state.txs)?state.txs.filter(t=>t&&t.status==='paid').map(t=>t.id):[];persist();}
// Repair legacy/partial restores before rendering any balance.
if(!Array.isArray(state.accs))state.accs=[];
if(!Array.isArray(state.txs))state.txs=[];
if(!state.cfg||typeof state.cfg!=='object')state.cfg={lang:'pt',currency:'BRL'};
if(!state.meta||typeof state.meta!=='object')state.meta={version:7};
state.meta.seriesRules=state.meta.seriesRules&&typeof state.meta.seriesRules==='object'?state.meta.seriesRules:{};
state.meta.seriesStarts=state.meta.seriesStarts&&typeof state.meta.seriesStarts==='object'?state.meta.seriesStarts:{};
state.meta.opening=state.meta.opening&&typeof state.meta.opening==='object'?state.meta.opening:{};
state.meta.excludedPaidIds=Array.isArray(state.meta.excludedPaidIds)?state.meta.excludedPaidIds:[];
state.accs.forEach(a=>{if(a&&a.id!=null&&state.meta.opening[a.id]==null)state.meta.opening[a.id]=Number(a.balance)||0});
try{persist()}catch(e){console.warn('Não foi possível salvar o reparo local',e)}
function persist(){write('txs',state.txs);write('accs',state.accs);write('balH',state.balH);write('ucfg',state.cfg);write('meta_v7',state.meta)}
const acc=id=>state.accs.find(a=>a.id===id);
const isTransfer=t=>t.type==='transfer_out'||t.type==='transfer_in';
const group=t=>t.seriesId||null;
const baseDesc=t=>(t.desc||'').replace(/ \(\d+\/\d+\)$/,'');
const effectiveDate=t=>t.dueDate||t.date||TODAY();
const txSign=t=>t.type==='income'||t.type==='transfer_in'?1:-1;
const contributes=t=>t.status==='paid'&&!state.meta.excludedPaidIds.includes(t.id);
function balance(aid){return +(Number((state.meta.opening||{})[aid]??acc(aid)?.balance??0)+state.txs.filter(t=>t.accountId===aid&&contributes(t)).reduce((s,t)=>s+txSign(t)*Number(t.amount||0),0)).toFixed(2)}
function monthEntries(month){const entries=state.txs.filter(t=>ym(effectiveDate(t))===month).map(t=>({...t}));
 const existing=new Set(entries.filter(t=>t.seriesId).map(t=>t.seriesId+'|'+effectiveDate(t)));
 const bySeries={};state.txs.filter(t=>t.recurrent&&t.seriesId&&!isTransfer(t)).forEach(t=>{(bySeries[t.seriesId]??=[]).push(t)});
 Object.entries(bySeries).forEach(([sid,items])=>{
  const sorted=items.sort((a,b)=>effectiveDate(a).localeCompare(effectiveDate(b)));
  const start=state.meta.seriesStarts[sid]||effectiveDate(sorted[0]);const frequency=sorted[0].recurrence||'monthly';
  for(let i=0;i<600;i++){const date=next(start,frequency,i);if(ym(date)>month)break;if(ym(date)!==month)continue;
   const rule=state.meta.seriesRules[sid]||{};
   if(rule.stopFrom&&date>=rule.stopFrom)continue;
   if((rule.skips||[]).includes(date))continue;
   if(existing.has(sid+'|'+date))continue;
   const template=sorted.filter(t=>effectiveDate(t)<=date).slice(-1)[0]||sorted[0];
   const patch=(rule.changes||[]).filter(x=>x.from<=date).slice(-1)[0]?.values||{};
   entries.push({...template,...patch,id:'virtual:'+sid+':'+date,date,dueDate:date,status:'pending',_virtual:true,desc:baseDesc(template),seriesId:sid});
  }
 });
 return entries.sort((a,b)=>effectiveDate(b).localeCompare(effectiveDate(a)));
}
function monthSummary(month){const arr=monthEntries(month);const future=month>ym(TODAY());const inc=arr.filter(t=>t.type==='income'&&(future||t.status==='paid')).reduce((s,t)=>s+Number(t.amount),0);const exp=arr.filter(t=>t.type==='expense'&&(future||t.status==='paid')).reduce((s,t)=>s+Number(t.amount),0);return {income:inc,expense:exp,result:inc-exp,entries:arr}}
function months(){const list=new Set([ym(TODAY()),state.month]);state.txs.forEach(t=>list.add(ym(effectiveDate(t))));for(let i=1;i<=12;i++)list.add(ym(monthShift(TODAY(),i)));return [...list].filter(Boolean).sort()}
function notify(msg){state.toast=msg;render();setTimeout(()=>{if(state.toast===msg){state.toast=null;render()}},2600)}
const root=()=>document.getElementById('app');
function render(){const el=root();if(!el)return;el.innerHTML=`<div class="top"><span>💠 Finance Real</span><span class="small muted">${fmtDate(TODAY())}</span></div><div class="content" id="content"></div><nav class="nav">${[['home','🏠 Início'],['transactions','📋 Extrato'],['alerts','🔔 Alertas'],['settings','⚙️ Config'],['user','👤 Perfil']].map(([k,v])=>`<button data-action="tab" data-tab="${k}" class="${state.tab===k?'active':''}">${v}</button>`).join('')}</nav><button class="btn fab" data-action="new">+</button>${state.modal?modalHTML():''}${state.toast?`<div class="toast">${esc(state.toast)}</div>`:''}`;
 const area=document.getElementById('content');area.innerHTML=state.tab==='home'?homeHTML():state.tab==='transactions'?transactionsHTML():state.tab==='alerts'?alertsHTML():state.tab==='settings'?settingsHTML():profileHTML();}
function monthPicker(){return `<div class="pillrow">${months().map(m=>`<button class="pill ${m===state.month?'active':''}" data-action="month" data-month="${m}">${m.slice(5)}/${m.slice(2,4)}${m>ym(TODAY())?' 📅':''}</button>`).join('')}</div>`}
function homeHTML(){const m=monthSummary(state.month),assets=state.accs.filter(a=>a.includeInTotal).reduce((s,a)=>s+balance(a.id),0),pending=state.txs.filter(t=>t.type==='expense'&&t.status==='pending').reduce((s,t)=>s+Number(t.amount),0);return `<div class="row" style="margin:5px 0 15px"><div><div class="muted small">PATRIMÔNIO TOTAL</div><div class="value ${assets>=0?'green':'red'}">${money(assets)}</div></div><button class="btn alt" data-action="backup">☁️ BKP</button></div>${monthPicker()}<div class="card"><div class="muted small">${state.month>ym(TODAY())?'📅 PROJEÇÃO':'RESULTADO'} · ${state.month}</div><div class="value ${m.result>=0?'green':'red'}">${money(m.result)}</div><div class="two" style="margin-top:13px"><div><div class="small muted">RECEITAS</div><strong class="green">${money(m.income)}</strong></div><div><div class="small muted">DESPESAS</div><strong class="red">${money(m.expense)}</strong></div></div><div class="small muted" style="margin-top:12px">Despesas pendentes registradas: ${money(pending)}</div></div><div class="row"><h3>Contas & Cartões</h3><button class="btn alt" data-action="tab" data-tab="settings">⚙ Configurar</button></div>${state.accs.length?'':'<div class="card notice">Nenhuma conta cadastrada. Acesse Configurações para cadastrar sua primeira conta antes de registrar lançamentos.</div>'}${state.accs.map(a=>`<div class="card row"><div><div>${esc(a.icon||'🏦')} ${esc(a.name)}</div><div class="small muted">${esc(a.type)}</div></div><strong style="color:${esc(a.color||'#818cf8')}">${money(balance(a.id))}</strong></div>`).join('')}<h3>Projeção mensal</h3><div class="card">${months().filter(m=>m>=ym(TODAY())).slice(0,7).map(m=>{const s=monthSummary(m);return `<button class="tx" data-action="month" data-month="${m}"><div class="txmain"><strong>${m}</strong><small>Receitas ${money(s.income)} · Despesas ${money(s.expense)}</small></div><strong class="${s.result>=0?'green':'red'}">${money(s.result)}</strong></button>`}).join('')}</div>`}
function transactionsHTML(){const entries=monthEntries(state.month).filter(t=>(state.filter==='all'||t.status===state.filter)&&(state.accountFilter==='all'||t.accountId===state.accountFilter));return `<h2>Extrato</h2>${monthPicker()}<div class="pillrow">${[['all','Todos'],['pending','A pagar'],['paid','Pagos']].map(([v,l])=>`<button class="pill ${state.filter===v?'active':''}" data-action="filter" data-value="${v}">${l}</button>`).join('')}</div><div class="pillrow"><button class="pill ${state.accountFilter==='all'?'active':''}" data-action="accountFilter" data-value="all">Todas</button>${state.accs.map(a=>`<button class="pill ${state.accountFilter===a.id?'active':''}" data-action="accountFilter" data-value="${esc(a.id)}">${esc(a.icon)} ${esc(a.name)}</button>`).join('')}</div>${entries.length?entries.map(txHTML).join(''):'<div class="card muted">Nenhum lançamento neste período.</div>'}`}
function txHTML(t){const a=acc(t.accountId);const positive=txSign(t)>0;return `<button class="tx" data-action="detail" data-id="${esc(t.id)}"><span style="font-size:21px">${(categories[t.cat]||'📦').split(' ')[0]}</span><span class="txmain"><strong>${esc(t.desc)}${t._virtual?' · 📅 previsto':''}</strong><small>${fmtDate(effectiveDate(t))} · ${esc(a?.name||'Sem conta')} · ${t.status==='paid'?'✓ Pago':'⏳ Pendente'}</small></span><strong class="${positive?'green':'red'}">${positive?'+':'−'}${money(t.amount)}</strong></button>`}
function alertsHTML(){const pending=state.txs.filter(t=>t.status==='pending'&&t.type==='expense').sort((a,b)=>effectiveDate(a).localeCompare(effectiveDate(b)));return `<h2>Alertas</h2>${pending.length?pending.map(t=>`<div>${txHTML(t)}<button class="btn alt wide" data-action="pay" data-id="${esc(t.id)}">✓ Marcar como pago</button></div>`).join(''):'<div class="card">🎉 Nenhuma despesa pendente registrada.</div>'}`}
function settingsHTML(){return `<h2>Configurações</h2><div class="card"><h3>☁️ Backup local</h3><p class="notice">Exportação de arquivo JSON. Não há integração real com Google Drive nesta versão.</p><button class="btn wide" data-action="backup">Exportar backup</button><label class="field"><span>Restaurar backup</span><input class="inp" type="file" id="restore" accept=".json,application/json"></label></div><div class="card"><h3>🏦 Contas e carteiras</h3>${state.accs.map(a=>`<div class="account"><div style="flex:1">${esc(a.icon||'🏦')} <strong>${esc(a.name)}</strong><div class="small muted">${money(balance(a.id))}</div></div><button class="btn alt" data-action="editAccount" data-id="${esc(a.id)}">Gerenciar</button></div>`).join('')}<button class="btn alt wide" data-action="newAccount">+ Nova conta</button></div><div class="card"><h3>📊 Ajuste de saldo mensal</h3><p class="notice">Os ajustes legados são mantidos no backup. A projeção usa os lançamentos para evitar dupla contabilização.</p></div>`}
function profileHTML(){return `<h2>Perfil</h2><div class="card"><h3>Finance Real</h3><p class="notice">Controle financeiro pessoal · Versão 7 · sem bibliotecas externas.</p><label class="field"><span>Moeda de exibição</span><select class="inp" id="currency">${['BRL','USD','EUR','GBP'].map(c=>`<option ${state.cfg.currency===c?'selected':''}>${c}</option>`).join('')}</select></label><p class="notice">A alteração da moeda muda apenas a apresentação, não converte valores.</p></div>`}
const input=(label,name,value,type='text')=>`<label class="field"><span>${label}</span><input class="inp" name="${name}" type="${type}" value="${esc(value??'')}" ${type==='number'?'step="0.01"':''}></label>`;
const select=(label,name,value,opts)=>`<label class="field"><span>${label}</span><select class="inp" name="${name}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
const accountOptions=()=>state.accs.map(a=>[a.id,(a.icon||'🏦')+' '+a.name]);
const typeOptions=[['expense','💸 Despesa'],['income','💰 Receita'],['transfer','🔄 Transferência']];
function modalHTML(){const m=state.modal,edit=state.edit||{},isEdit=m==='edit',isDetail=m==='detail';let title='',body='';
 if(m==='new'||isEdit){title=isEdit?'Editar lançamento':'Novo lançamento';const f=isEdit?edit:(state.draft||{type:'expense',desc:'',amount:'',cat:'other',accountId:state.accs[0]?.id||'',toId:state.accs[1]?.id||'',date:TODAY(),dueDate:TODAY(),status:'pending',recurrent:false,recurrence:'monthly',installments:false,installCount:2});
  body=`<form id="txform">${select('Tipo','type',f.type,typeOptions)}${input('Descrição','desc',f.desc)}${input('Valor','amount',f.amount,'number')}${select(f.type==='transfer'?'Conta de origem':'Conta','accountId',f.accountId,accountOptions())}${f.type==='transfer'?select('Conta de destino','toId',f.toId,accountOptions()):select('Categoria','cat',f.cat,Object.entries(categories))}${select('Status','status',f.status,[['pending','Pendente'],['paid','Pago']])}${input(f.status==='paid'?'Data da operação':'Data do vencimento','dueDate',f.dueDate||f.date,'date')}${f.type!=='transfer'?`<label class="toggle"><input type="checkbox" name="recurrent" ${f.recurrent?'checked':''}> Recorrente</label>${select('Frequência','recurrence',f.recurrence||'monthly',[['weekly','Semanal'],['monthly','Mensal'],['yearly','Anual']])}${f.type==='expense'&&!isEdit?`<label class="toggle"><input type="checkbox" name="installments" ${f.installments?'checked':''}> Parcelado</label>${input('Quantidade de parcelas','installCount',f.installCount||2,'number')}`:''}`:''}${isEdit&&edit.seriesId?select('Aplicar alteração','scope',state.scope,[['only','Somente este'],['future','Este e futuros'],['all','Todos da série']]):''}<button class="btn wide" type="submit">${isEdit?'Salvar alterações':'Adicionar lançamento'}</button></form>`;
 }else if(isDetail){const t=state.selected;title=t?.desc||'Lançamento';body=t?`<div class="stack"><div>Valor: <strong>${money(t.amount)}</strong></div><div>Vencimento: ${fmtDate(effectiveDate(t))}</div><div>Conta: ${esc(acc(t.accountId)?.name||'—')}</div><div>Status: ${t.status==='paid'?'Pago':'Pendente'}</div>${t._virtual?'<p class="notice">Ocorrência projetada. Você pode editar, pagar ou excluir esta ocorrência.</p>':''}<div class="actions"><button class="btn" data-action="editSelected">✏️ Editar</button>${t.status==='pending'?'<button class="btn alt" data-action="paySelected">✓ Pagar</button>':''}<button class="btn danger" data-action="deleteSelected">🗑 Excluir</button></div></div>`:'';
 }else if(m==='delete'){title='Excluir lançamento';const t=state.selected;body=`<p class="notice">${esc(t?.desc)} · ${money(t?.amount)}</p>${t?.seriesId?`<div class="stack"><button class="btn alt" data-action="confirmDelete" data-scope="only">Somente este</button><button class="btn alt" data-action="confirmDelete" data-scope="future">Este e futuros</button><button class="btn danger" data-action="confirmDelete" data-scope="all">Todos da série</button></div>`:'<button class="btn danger wide" data-action="confirmDelete" data-scope="only">Confirmar exclusão</button>'}`;
 }else if(m==='account'){title=edit.id?'Gerenciar conta':'Nova conta';body=`<form id="accountform">${input('Nome','name',edit.name||'')}${select('Tipo','type',edit.type||'checking',[['checking','Conta corrente'],['savings','Poupança'],['credit','Cartão de crédito'],['wallet','Carteira']])}${input(edit.id?'Saldo inicial de referência':'Saldo inicial','balance',edit.id?state.meta.opening[edit.id]:0,'number')}${input('Ícone','icon',edit.icon||'🏦')}${input('Cor','color',edit.color||'#6366f1','color')}<label class="toggle"><input type="checkbox" name="includeInTotal" ${edit.includeInTotal!==false?'checked':''}> Incluir no patrimônio</label><button class="btn wide" type="submit">Salvar conta</button></form>${edit.id?'<div class="divider"></div><button class="btn danger wide" data-action="deleteAccount">Excluir conta</button>':''}`;
 }else if(m==='deleteAccount'){title='Excluir conta';const a=acc(edit.id);const related=state.txs.filter(t=>t.accountId===edit.id).length;body=`<p class="notice">${esc(a?.name)} possui ${related} lançamentos associados. Para evitar perda de histórico, transfira os lançamentos e o saldo para outra conta ou cancele.</p>${select('Transferir lançamentos e saldo para','destination',state.accs.find(a=>a.id!==edit.id)?.id||'',accountOptions().filter(([k])=>k!==edit.id))}<button class="btn danger wide" data-action="confirmAccountDelete">Transferir e excluir</button>`;
 }return `<div class="overlay" data-action="backdrop"><div class="modal"><div class="row" style="margin-bottom:13px"><h3>${esc(title)}</h3><button class="btn alt" data-action="close">✕</button></div>${body}</div></div>`}
function openNew(){if(!state.accs.length){state.tab='settings';notify('Cadastre uma conta em Configurações antes de lançar.');return;}state.modal='new';state.edit=null;state.draft=null;render()}
function openDetail(t){state.selected=t;state.modal='detail';render()}
function getTx(id){return id.startsWith('virtual:')?monthEntries(ym(id.split(':').slice(-1)[0])).find(t=>t.id===id):state.txs.find(t=>t.id===id)}
function formValues(form){const d=new FormData(form);return Object.fromEntries(d.entries())}
function validTx(f){const amount=Number(f.amount);if(!f.desc?.trim()||!Number.isFinite(amount)||amount<=0)throw Error('Informe descrição e valor positivo.');if(!/^\d{4}-\d\d-\d\d$/.test(f.dueDate))throw Error('Informe uma data válida.');if(!acc(f.accountId))throw Error('Selecione uma conta válida.');if(f.type==='transfer'&&(!acc(f.toId)||f.accountId===f.toId))throw Error('Selecione contas diferentes.');return amount}
function transferPair(f,pairId){const from=acc(f.accountId),to=acc(f.toId),common={amount:Number(f.amount),date:f.dueDate,dueDate:f.dueDate,status:f.status,cat:'transfer',recurrent:false,transferPairId:pairId};return [{...common,id:id(),type:'transfer_out',desc:f.desc+' → '+to.name,accountId:from.id},{...common,id:id(),type:'transfer_in',desc:f.desc+' ← '+from.name,accountId:to.id}]}
function commitNew(f){const amount=validTx(f);const common={desc:f.desc.trim(),amount,type:f.type,cat:f.cat||'other',date:f.dueDate,dueDate:f.dueDate,status:f.status,accountId:f.accountId,recurrent:!!f.recurrent,recurrence:f.recurrence||'monthly'};
 if(f.type==='transfer'){state.txs.push(...transferPair(f,id()));}
 else if(f.installments&&f.type==='expense'){const n=Math.floor(Number(f.installCount));if(n<2||n>120)throw Error('Informe entre 2 e 120 parcelas.');const sid='s_'+id();for(let i=0;i<n;i++){const due=monthShift(f.dueDate,i);state.txs.push({...common,id:id(),date:due,dueDate:due,desc:`${common.desc} (${i+1}/${n})`,seriesId:sid,recurrent:false,installmentIndex:i+1,installmentCount:n});}}
 else{const sid=f.recurrent?'s_'+id():undefined;state.txs.push({...common,id:id(),seriesId:sid});if(sid)state.meta.seriesStarts[sid]=f.dueDate;}
 state.month=ym(f.dueDate);persist();state.modal=null;notify('Lançamento registrado ✓')}
function materialize(t){if(!t._virtual)return t;const real={...t,id:id(),_virtual:undefined};state.txs.push(real);return real}
function updatePair(t,f){const old=state.txs.filter(x=>x.transferPairId===t.transferPairId);if(old.length!==2)throw Error('Transferência inconsistente: par incompleto.');const pid=t.transferPairId;state.txs=state.txs.filter(x=>x.transferPairId!==pid);state.meta.excludedPaidIds=state.meta.excludedPaidIds.filter(i=>!old.some(t=>t.id===i));state.txs.push(...transferPair(f,pid));}
function editSelected(){const t=state.selected;if(!t)return;let toId='';if(isTransfer(t)){const peer=state.txs.find(x=>x.transferPairId===t.transferPairId&&x.id!==t.id);const out=t.type==='transfer_out'?t:peer;const incoming=t.type==='transfer_in'?t:peer;state.edit={...t,type:'transfer',desc:baseDesc(out?.desc||t.desc).split(' → ')[0],accountId:out?.accountId,toId:incoming?.accountId};}else state.edit={...t,desc:baseDesc(t),toId:state.accs.find(a=>a.id!==t.accountId)?.id||''};state.scope='only';state.modal='edit';render()}
function applyEdit(f){validTx(f);const old=state.selected;if(!old)throw Error('Lançamento não encontrado.');const scope=f.scope||'only';if(isTransfer(old)){updatePair(old,f);}
 else{
 const sid=old.seriesId,anchor=effectiveDate(old),rule=sid?(state.meta.seriesRules[sid]??={skips:[],changes:[]}):null;
 const patch={desc:f.desc.trim(),amount:Number(f.amount),type:f.type,cat:f.cat,accountId:f.accountId,status:f.status,recurrent:!!f.recurrent,recurrence:f.recurrence,dueDate:f.dueDate,date:f.dueDate};
 if(f.type==='transfer'){
  if(sid&&scope!=='only')throw Error('Converta a série em lançamentos individuais antes de criar transferências.');
  if(old._virtual){rule.skips.push(anchor)}else{state.txs=state.txs.filter(t=>t.id!==old.id)}
  state.txs.push(...transferPair(f,id()));
 }else if(sid&&scope!=='only'){
  const candidates=state.txs.filter(t=>t.seriesId===sid&&(scope==='all'||effectiveDate(t)>=anchor));
  const orig=state.txs.filter(t=>t.seriesId===sid).sort((a,b)=>effectiveDate(a).localeCompare(effectiveDate(b)))[0];
  const base=scope==='all'?(state.meta.seriesStarts[sid]||effectiveDate(orig)):anchor;
  const offset=(old._virtual?0:0);
  candidates.forEach(t=>{const due=effectiveDate(t);const newDue=scope==='all'?next(f.dueDate,t.recurrence||'monthly',Math.max(0,monthsBetween(base,due,t.recurrence||'monthly'))):next(f.dueDate,t.recurrence||'monthly',Math.max(0,monthsBetween(anchor,due,t.recurrence||'monthly')));Object.assign(t,patch,{date:newDue,dueDate:newDue,desc:t.installmentIndex?`${f.desc.trim()} (${t.installmentIndex}/${t.installmentCount})`:f.desc.trim()});});
  if(scope==='all'){state.meta.seriesStarts[sid]=f.dueDate;rule.changes=[{from:f.dueDate,values:{...patch,date:undefined,dueDate:undefined}}];}
  else{rule.changes=(rule.changes||[]).filter(c=>c.from<anchor);rule.changes.push({from:anchor,values:{...patch,date:undefined,dueDate:undefined}});}
 }else{
  const original=old._virtual?materialize(old):state.txs.find(t=>t.id===old.id);
  if(old._virtual&&sid&&anchor!==f.dueDate){rule.skips.push(anchor)}
  Object.assign(original,patch);if(old._virtual){original.seriesId=sid;}
 }
 }
 state.month=ym(f.dueDate);persist();state.modal=null;state.selected=null;notify('Lançamento atualizado ✓')}
function monthsBetween(a,b,freq){if(freq==='weekly')return Math.max(0,Math.round((new Date(b)-new Date(a))/604800000));const [y,m]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);const n=(y2-y)*12+(m2-m);return freq==='yearly'?Math.max(0,Math.round(n/12)):Math.max(0,n)}
function deleteSelected(scope){const t=state.selected;if(!t)return;const sid=t.seriesId,anchor=effectiveDate(t);if(isTransfer(t)){state.txs=state.txs.filter(x=>x.transferPairId!==t.transferPairId)}else if(!sid){state.txs=state.txs.filter(x=>x.id!==t.id)}else{const rule=state.meta.seriesRules[sid]??={skips:[],changes:[]};if(scope==='only'){if(t._virtual)rule.skips.push(anchor);else{state.txs=state.txs.filter(x=>x.id!==t.id);rule.skips.push(anchor)}}else if(scope==='future'){state.txs=state.txs.filter(x=>x.seriesId!==sid||effectiveDate(x)<anchor);rule.stopFrom=anchor}else if(scope==='all'){state.txs=state.txs.filter(x=>x.seriesId!==sid);rule.stopFrom='0000-01-01'}}state.modal=null;state.selected=null;persist();notify('Lançamento excluído ✓')}
function markPaid(t){if(!t)return;if(isTransfer(t)){state.txs.forEach(x=>{if(x.transferPairId===t.transferPairId)x.status='paid'})}else{const real=materialize(t);real.status='paid'}persist();state.modal=null;notify('Pagamento registrado ✓')}
function saveAccount(f){if(!f.name?.trim())throw Error('Informe o nome da conta.');const opening=Number(f.balance);if(!Number.isFinite(opening))throw Error('Saldo inicial inválido.');const a=state.edit?.id?acc(state.edit.id):null;if(a){Object.assign(a,{name:f.name,type:f.type,icon:f.icon,color:f.color,includeInTotal:!!f.includeInTotal});state.meta.opening[a.id]=opening}else{const aid='a_'+id();state.accs.push({id:aid,name:f.name,type:f.type,icon:f.icon,color:f.color,balance:opening,includeInTotal:!!f.includeInTotal});state.meta.opening[aid]=opening}persist();state.modal=null;notify('Conta salva ✓')}
function deleteAccount(){const aid=state.edit?.id,dest=document.querySelector('[name=destination]')?.value;if(!aid||!acc(dest)||aid===dest)throw Error('Selecione uma conta de destino.');const oldBalance=balance(aid);state.txs.forEach(t=>{if(t.accountId===aid)t.accountId=dest});state.meta.opening[dest]=(state.meta.opening[dest]??0)+(state.meta.opening[aid]??0);delete state.meta.opening[aid];state.accs=state.accs.filter(a=>a.id!==aid);state.modal=null;persist();notify(`Conta excluída; saldo de referência ${money(oldBalance)} transferido.`)}
function backup(){const data={app:'Finance Real',version:7,exportedAt:new Date().toISOString(),transactions:state.txs,accounts:state.accs,balanceHistory:state.balH,meta:state.meta,userConfig:state.cfg};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='FinanceReal_'+TODAY()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notify('Backup exportado ✓')}
function restore(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.accounts)||!Array.isArray(d.transactions))throw Error('Arquivo inválido');
if(d.accounts.some(a=>!a||typeof a.id!=='string'||!a.id||typeof a.name!=='string')||new Set(d.accounts.map(a=>a.id)).size!==d.accounts.length)throw Error('Contas inválidas ou duplicadas');
if(d.transactions.some(t=>!t||typeof t.id!=='string'||!Number.isFinite(Number(t.amount))||Number(t.amount)<0))throw Error('Lançamentos inválidos');
if(!confirm('Substituir todos os dados atuais? Faça backup antes de continuar.'))return;state.accs=d.accounts;state.txs=d.transactions;state.balH=d.balanceHistory||{};state.cfg=d.userConfig||state.cfg;state.meta=d.meta||{version:7,opening:Object.fromEntries(d.accounts.map(a=>[a.id,Number(a.balance)||0])),excludedPaidIds:d.transactions.filter(t=>t.status==='paid').map(t=>t.id),seriesRules:{},seriesStarts:{}};state.meta.seriesRules=state.meta.seriesRules||{};state.meta.seriesStarts=state.meta.seriesStarts||{};state.meta.opening=state.meta.opening||{};state.meta.excludedPaidIds=Array.isArray(state.meta.excludedPaidIds)?state.meta.excludedPaidIds:[];
state.accs.forEach(a=>{if(state.meta.opening[a.id]==null)state.meta.opening[a.id]=Number(a.balance)||0});
state.tab='home';state.modal=null;state.selected=null;state.accountFilter='all';persist();notify('Backup restaurado ✓')}catch(e){alert('Falha na restauração: '+e.message)}};r.readAsText(file)}
function safe(fn){try{fn()}catch(e){console.error(e);alert(e.message||'Erro inesperado')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;safe(()=>{switch(a){case 'tab':state.tab=b.dataset.tab;render();break;case 'month':state.month=b.dataset.month;render();break;case 'filter':state.filter=b.dataset.value;render();break;case 'accountFilter':state.accountFilter=b.dataset.value;render();break;case 'new':openNew();break;case 'close':state.modal=null;render();break;case 'backdrop':if(e.target===b){state.modal=null;render()}break;case 'detail':openDetail(getTx(b.dataset.id));break;case 'editSelected':editSelected();break;case 'deleteSelected':state.modal='delete';render();break;case 'confirmDelete':deleteSelected(b.dataset.scope);break;case 'paySelected':markPaid(state.selected);break;case 'pay':markPaid(getTx(b.dataset.id));break;case 'newAccount':state.edit={};state.modal='account';render();break;case 'editAccount':state.edit={...acc(b.dataset.id)};state.modal='account';render();break;case 'deleteAccount':state.modal='deleteAccount';render();break;case 'confirmAccountDelete':deleteAccount();break;case 'backup':backup();break;}})});
document.addEventListener('submit',e=>{if(!['txform','accountform'].includes(e.target.id))return;e.preventDefault();safe(()=>{const f=formValues(e.target);if(e.target.id==='accountform'){f.includeInTotal=e.target.elements.includeInTotal.checked;saveAccount(f);return}f.recurrent=!!e.target.elements.recurrent?.checked;f.installments=!!e.target.elements.installments?.checked;if(f.installments)f.recurrent=false;if(f.type==='transfer')f.recurrent=false;if(state.modal==='edit')applyEdit(f);else commitNew(f)})});
document.addEventListener('change',e=>{if(e.target.id==='restore'&&e.target.files[0])restore(e.target.files[0]);if(e.target.id==='currency'){state.cfg.currency=e.target.value;persist();render()}if(e.target.name==='type'&&state.modal==='new'){const form=e.target.closest('form');const values=formValues(form);state.draft={...state.draft,...values,recurrent:form.elements.recurrent?.checked||false,installments:form.elements.installments?.checked||false};state.modal='new';render()} });
try{render()}catch(e){console.error('Erro ao iniciar Finance Real:',e);const el=document.getElementById('app');if(el)el.innerHTML='<div style="padding:24px;color:white;font-family:sans-serif"><h2>Não foi possível iniciar o Finance Real</h2><p>Seus dados não foram apagados. Abra o console do navegador para identificar o erro.</p></div>'}window.FinanceRealTest={monthShift,monthEntries,monthSummary,balance,commitNew,applyEdit,deleteSelected,state};
})();
